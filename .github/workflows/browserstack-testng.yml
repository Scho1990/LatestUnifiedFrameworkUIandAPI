name: BrowserStack TestNG Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Select TestNG Suite
        required: true
        default: ui-testng.xml
        type: choice
        options:
          - ui-testng.xml
          - testng.xml
      browser:
        description: Select Browser
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - edge
          - firefox

jobs:
  test:
    runs-on: windows-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven Compile
        run: mvn clean compile

      - name: Execute TestNG Suite
        shell: cmd
        run: |
         mvn test -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} -DsuiteXmlFile=src/test/resources/suites/${{ github.event.inputs.suite || 'ui-testng.xml' }}

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-maven-plugin/

      - name: Build Success
        if: success()
        run: |
          echo =====================================
          echo BUILD SUCCESSFUL
          echo Run Number: ${{ github.run_number }}
          echo Workflow: ${{ github.workflow }}
          echo Branch: ${{ github.ref_name }}
          echo =====================================

      - name: Build Failure
        if: failure()
        run: |
          echo =====================================
          echo BUILD FAILED
          echo Check workflow logs and artifacts
          echo =====================================
